<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Socket Test</title>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .log { background: #f0f0f0; padding: 10px; margin: 5px 0; border-radius: 4px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
        button { padding: 10px 20px; margin: 5px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:disabled { background: #6c757d; }
    </style>
</head>
<body>
    <h1>Simple Socket.IO Test</h1>
    <div id="status">Status: Menunggu...</div>
    <button id="connectBtn">Connect</button>
    <button id="disconnectBtn" disabled>Disconnect</button>
    <button id="testBtn" disabled>Test Message</button>
    <div id="logs"></div>

    <script>
        const logs = document.getElementById('logs');
        const status = document.getElementById('status');
        const connectBtn = document.getElementById('connectBtn');
        const disconnectBtn = document.getElementById('disconnectBtn');
        const testBtn = document.getElementById('testBtn');
        
        let socket = null;

        function log(message, type = 'info') {
            console.log(message);
            const div = document.createElement('div');
            div.className = 'log ' + type;
            div.innerHTML = new Date().toLocaleTimeString() + ' - ' + message;
            logs.appendChild(div);
            logs.scrollTop = logs.scrollHeight;
        }

        function connect() {
            if (socket) return;
            
            log('Mencoba koneksi...', 'info');
            status.textContent = 'Status: Menghubungkan...';
            
            // Gunakan URL dinamis dari current origin
            const baseUrl = window.location.origin;
            
            // Coba berbagai path dan konfigurasi
            const configs = [
                { url: baseUrl, path: '/api/socket', transports: ['websocket'] },
                { url: baseUrl, path: '/api/socket', transports: ['polling'] },
                { url: baseUrl, path: '/api/socket/io', transports: ['websocket'] },
                { url: baseUrl, path: '/api/socket/io', transports: ['polling'] }
            ];
            
            let configIndex = 0;
            
            function tryConnect() {
                if (configIndex >= configs.length) {
                    log('Semua konfigurasi gagal', 'error');
                    status.textContent = 'Status: Gagal';
                    return;
                }
                
                const config = configs[configIndex];
                log(`Mencoba konfigurasi ${configIndex + 1}: ${config.path} dengan ${config.transports[0]}`, 'info');
                
                socket = io(config.url, {
                    path: config.path,
                    transports: config.transports,
                    timeout: 5000,
                    forceNew: true
                });
                
                socket.on('connect', () => {
                    log(`✅ Berhasil terhubung dengan config ${configIndex + 1}! Socket ID: ${socket.id}`, 'success');
                    status.textContent = `Status: Terhubung (Config ${configIndex + 1})`;
                    connectBtn.disabled = true;
                    disconnectBtn.disabled = false;
                    testBtn.disabled = false;
                });
                
                socket.on('connect_error', (error) => {
                    log(`❌ Config ${configIndex + 1} gagal: ${error.message}`, 'error');
                    socket.disconnect();
                    socket = null;
                    configIndex++;
                    setTimeout(tryConnect, 1000);
                });
                
                socket.on('disconnect', () => {
                    log('Terputus dari server', 'info');
                    status.textContent = 'Status: Terputus';
                    connectBtn.disabled = false;
                    disconnectBtn.disabled = true;
                    testBtn.disabled = true;
                    socket = null;
                });
                
                socket.on('message', (data) => {
                    log('Pesan diterima: ' + JSON.stringify(data), 'success');
                });
            }
            
            tryConnect();
        }

        function disconnect() {
            if (socket) {
                socket.disconnect();
                socket = null;
            }
        }

        function testMessage() {
            if (socket && socket.connected) {
                socket.emit('test', { message: 'Hello from client!', timestamp: Date.now() });
                log('Mengirim test message', 'info');
            }
        }

        connectBtn.addEventListener('click', connect);
        disconnectBtn.addEventListener('click', disconnect);
        testBtn.addEventListener('click', testMessage);

        // Auto connect on load
        setTimeout(connect, 1000);
    </script>
</body>
</html>
